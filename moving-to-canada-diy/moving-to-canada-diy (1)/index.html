    <!-- === JAVASCRIPT TIMER CODE === -->
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const COUNTDOWN_TIME = 12 * 60 * 60 * 1000;
        let targetTime = localStorage.getItem("bootcamp_target_time");

        if (!targetTime) {
            targetTime = new Date().getTime() + COUNTDOWN_TIME;
            localStorage.setItem("bootcamp_target_time", targetTime);
        } else {
            targetTime = parseInt(targetTime, 10);
        }

        const bannerElement = document.querySelector('header, .bg-red-600'); 
        
        function updateTimer() {
            const now = new Date().getTime();
            const difference = targetTime - now;

            if (difference <= 0) {
                const newTarget = new Date().getTime() + COUNTDOWN_TIME;
                localStorage.setItem("bootcamp_target_time", newTarget);
                targetTime = newTarget;
                return;
            }

            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            const hStr = String(hours).padStart(2, '0');
            const mStr = String(minutes).padStart(2, '0');
            const sStr = String(seconds).padStart(2, '0');
            
            const textSpan = document.getElementById("timer-display");
            if(textSpan) {
                textSpan.textContent = hStr + "h : " + mStr + "m : " + sStr + "s";
            }
        }

        if (bannerElement) {
            bannerElement.innerHTML = '<div class="text-center font-mono font-bold tracking-wider text-sm md:text-base py-2.5 px-4 text-white">🚨 WARNING: Live WhatsApp Screen-Share Room access tokens expire, and registration closes forever in: <span id="timer-display">12h : 00m : 00s</span></div>';
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    });
    </script>
    <!-- === END JAVASCRIPT TIMER CODE === -->
  </body>
